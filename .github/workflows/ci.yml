name: Server boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o bin/server-api ./cmd/zennotes-server
      - run: go run ./cmd/prepare-web -manifest web-artifact/manifest.json -output web/dist
      - run: go test -tags=embed_web ./web
      - run: go build -tags=embed_web -trimpath -o bin/zennotes-server ./cmd/zennotes-server
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build server with pinned Nix toolchain and browser artifact
        run: docker run --rm -v "$PWD:/source:ro" nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c sh -c 'cd /source && nix-build --no-out-link'

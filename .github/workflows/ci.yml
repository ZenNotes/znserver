name: Server boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o bin/server-api ./cmd/zennotes-server
      - run: go run ./cmd/prepare-web -manifest web-artifact/manifest.json -output web/dist
      - run: go test -tags=embed_web ./web
      - run: go build -tags=embed_web -trimpath -o bin/zennotes-server ./cmd/zennotes-server
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
  # What a scratch image lacks only shows when it runs: an upload over 8 MiB needs /tmp.
  docker-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zennotes:ci
      - name: Upload 12 MiB to the running image
        run: |
          mkdir vault data
          chmod 777 vault data
          docker run -d --name zennotes -p 127.0.0.1:7878:7878 -v "$PWD/vault:/workspace" -v "$PWD/data:/data" -e ZENNOTES_AUTH_TOKEN=ci-token zennotes:ci
          for attempt in $(seq 1 30); do curl -fs http://127.0.0.1:7878/healthz && break; sleep 1; done
          head -c 12582912 /dev/zero > big.bin
          curl -fsS -H 'Authorization: Bearer ci-token' -F file=@big.bin http://127.0.0.1:7878/api/assets/upload
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build server with pinned Nix toolchain and browser artifact
        run: docker run --rm -v "$PWD:/source:ro" nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c sh -c 'cd /source && nix-build --no-out-link'
